name: Release

# Push a tag like v0.1.1 to publish that version to npm.
# Publishing uses npm trusted publishing (OIDC): no npm token is stored here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          echo "package.json: $version, tag: $GITHUB_REF_NAME"
          test "$version" = "$GITHUB_REF_NAME"
      - run: npm run typecheck && npm test && npm run build
      # Provenance is added automatically with trusted publishing.
      - run: npm publish --access public
