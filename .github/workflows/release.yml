name: Release

# Push a tag like v0.1.2 to stage that version on npm, then approve it there.
# Publishing uses npm trusted publishing (OIDC): no npm token is stored here.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing and `npm stage` need a recent npm 11.
      - run: npm install -g npm@^11.21.1
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          echo "package.json: $version, tag: $GITHUB_REF_NAME"
          test "$version" = "$GITHUB_REF_NAME"
      - run: npm run typecheck && npm test && npm run build
      # Stages the version: it becomes public only after a maintainer approves it
      # on npmjs.com (or with `npm stage approve <id>`) with 2FA.
      # Provenance is added automatically with trusted publishing.
      - run: npm stage publish --access public
